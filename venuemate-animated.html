<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VenueMate — animated</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;background:#f5f3ff}iframe{display:block}</style></head><body><iframe id="site" src="index.html" title="VenueMate"></iframe><script>const f=document.querySelector('#site');f.onload=()=>{const d=f.contentDocument;const s=d.createElement('style');s.textContent=`:root{--ink:#19162d;--forest:#27234e;--cream:#f5f3ff;--paper:#fff;--coral:#9e6cff;--gold:#f7bd5b;--muted:#77738e;--line:#e4e1f2}.nav{background:#f5f3fff0}.hero{background:linear-gradient(90deg,#17132fef 0%,#27234ecc 46%,#27234e12 78%),url('https://images.unsplash.com/photo-1519167758481-83f550bb49b3?auto=format&fit=crop&w=2000&q=88') center/cover}.coral-btn,.search button,.subscribe button{background:#9e6cff;transition:transform .25s ease,box-shadow .25s ease,background .25s ease}.coral-btn:hover,.search button:hover,.subscribe button:hover{background:#8755ef;transform:translateY(-3px);box-shadow:0 9px 20px #6d48b34d}.occasions,footer{background:#27234e}.view{color:#6250a8}.occasions .view{color:#f7bd5b!important}.heart{transition:transform .25s ease,color .25s ease}.heart:hover{transform:scale(1.12)}.card{animation:rise .75s both}.card:nth-child(1){animation-delay:120ms}.card:nth-child(2){animation-delay:240ms}.card:nth-child(3){animation-delay:360ms}.hero-copy>*{animation:rise .8s both}.hero-copy .eyebrow{animation-delay:100ms}.hero-copy h1{animation-delay:210ms}.hero-copy p{animation-delay:320ms}.hero-copy .search{animation-delay:430ms}.stats{animation:rise .8s 480ms both}.occasion{transition:transform .3s ease,background .3s ease}.occasion:hover{transform:translateY(-8px);background:#ffffff17}.story-img{transition:transform .6s ease,filter .6s ease}.story-img:hover{transform:scale(1.025);filter:saturate(1.15)}.reveal{opacity:0;transform:translateY(28px);transition:opacity .75s ease,transform .75s ease}.reveal.show{opacity:1;transform:none}@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}`;d.head.append(s);const o=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&e.target.classList.add('show')),{threshold:.14});d.querySelectorAll('main>section').forEach((e,i)=>{if(i){e.classList.add('reveal');o.observe(e)}})}};</script></body></html>
